<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kameti Pro - Hamza Digital Ledger</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b5e20;
            --accent: #4caf50;
            --dark: #121212;
            --surface: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
        }

        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background: var(--dark); color: var(--text-main); margin: 0; padding-bottom: 80px; }

        /* UI Components */
        .app-bar {
            background: var(--primary); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .container { padding: 15px; max-width: 600px; margin: auto; }

        .dashboard {
            background: linear-gradient(145deg, #252525, #1a1a1a);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around; border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stat-box { text-align: center; }
        .stat-box h2 { margin: 0; color: var(--accent); font-size: 24px; }
        .stat-box p { margin: 5px 0 0; font-size: 11px; color: var(--text-dim); text-transform: uppercase; }

        /* Member Card Design - 100% Like App */
        .member-card {
            background: var(--surface); padding: 16px; border-radius: 12px;
            margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; border-left: 4px solid #444; transition: 0.3s;
        }
        .member-card.paid { border-left-color: var(--accent); background: #1b2e1d; }

        .m-details h4 { margin: 0; font-size: 17px; letter-spacing: 0.5px; }
        .m-details p { margin: 4px 0 0; font-size: 13px; color: var(--text-dim); }

        .m-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
        
        .status-badge {
            padding: 6px 12px; border-radius: 20px; font-size: 11px;
            font-weight: bold; cursor: pointer; border: 1px solid #444;
        }
        .status-badge.unpaid { color: #ff5252; border-color: #ff5252; }
        .status-badge.paid { background: var(--accent); color: white; border-color: var(--accent); }

        .small-btns { display: flex; gap: 10px; margin-top: 5px; }
        .icon-btn { cursor: pointer; opacity: 0.6; font-size: 14px; }
        .icon-btn:hover { opacity: 1; }

        /* Floating Action Button */
        .fab {
            position: fixed; bottom: 25px; right: 25px;
            width: 60px; height: 60px; background: var(--accent);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); cursor: pointer; border: none; color: white; font-size: 30px;
        }

        /* Modal styling */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { background: var(--surface); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; }
        input {
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px;
            border: 1px solid #333; background: #000; color: white; outline: none;
        }
        input:focus { border-color: var(--accent); }
        .btn-block { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--accent); color: white; }

    </style>
</head>
<body>

<div class="app-bar">
    <div style="font-weight: 700; font-size: 20px;">Kameti Pro Ledger</div>
    <div style="font-size: 12px; opacity: 0.7;">v2.1 Stable</div>
</div>

<div class="container">
    <div class="dashboard">
        <div class="stat-box">
            <h2 id="pCount">0</h2>
            <p>Paid Persons</p>
        </div>
        <div class="stat-box">
            <h2 id="tCash">0</h2>
            <p>Total (PKR)</p>
        </div>
    </div>

    <div id="memberList">
        </div>
</div>

<button class="fab" onclick="showAddModal()">+</button>

<div class="modal" id="formModal">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-top:0">Add New Member</h2>
        <input type="hidden" id="editId">
        <input type="text" id="mName" placeholder="Full Name">
        <input type="number" id="mAmt" placeholder="Amount (e.g. 5000)">
        <button class="btn-block btn-primary" onclick="saveData()">SAVE RECORD</button>
        <button onclick="closeModal()" style="background:none; color:gray; width:100%; border:none; margin-top:10px;">Cancel</button>
    </div>
</div>

<script>
    let members = JSON.parse(localStorage.getItem('kameti_ledger_final')) || [];

    function showAddModal() {
        document.getElementById('modalTitle').innerText = "Add New Member";
        document.getElementById('editId').value = '';
        document.getElementById('mName').value = '';
        document.getElementById('mAmt').value = '';
        document.getElementById('formModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('formModal').style.display = 'none'; }

    function saveData() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('mName').value;
        const amt = document.getElementById('mAmt').value;

        if(!name || !amt) return alert("Please fill all fields!");

        if(id) {
            // Update existing
            const idx = members.findIndex(m => m.id == id);
            members[idx].name = name;
            members[idx].amt = parseFloat(amt);
        } else {
            // Add new
            members.push({
                id: Date.now(),
                name: name,
                amt: parseFloat(amt),
                paid: false,
                date: new Date().toLocaleDateString('en-GB')
            });
        }
        
        sync();
        closeModal();
    }

    function togglePay(id) {
        const idx = members.findIndex(m => m.id === id);
        members[idx].paid = !members[idx].paid;
        sync();
    }

    function editMember(id) {
        const m = members.find(m => m.id === id);
        document.getElementById('modalTitle').innerText = "Edit Member";
        document.getElementById('editId').value = m.id;
        document.getElementById('mName').value = m.name;
        document.getElementById('mAmt').value = m.amt;
        document.getElementById('formModal').style.display = 'flex';
    }

    function deleteMember(id) {
        if(confirm("Delete this record permanently?")) {
            members = members.filter(m => m.id !== id);
            sync();
        }
    }

    function shareToWhatsApp(name, amt, status) {
        const msg = `*Kameti Record*%0A*Name:* ${name}%0A*Amount:* Rs. ${amt}%0A*Status:* ${status === true ? '✅ PAID' : '❌ UNPAID'}`;
        window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    function sync() {
        localStorage.setItem('kameti_ledger_final', JSON.stringify(members));
        render();
    }

    function render() {
        const listDiv = document.getElementById('memberList');
        const pCount = document.getElementById('pCount');
        const tCash = document.getElementById('tCash');
        
        listDiv.innerHTML = '';
        let cash = 0, count = 0;

        members.forEach(m => {
            if(m.paid) { cash += m.amt; count++; }
            
            listDiv.innerHTML += `
                <div class="member-card ${m.paid ? 'paid' : ''}">
                    <div class="m-details">
                        <h4>${m.name}</h4>
                        <p>Rs. ${m.amt.toLocaleString()} • ${m.date}</p>
                    </div>
                    <div class="m-actions">
                        <div class="status-badge ${m.paid ? 'paid' : 'unpaid'}" onclick="togglePay(${m.id})">
                            ${m.paid ? 'PAID' : 'MARK PAID'}
                        </div>
                        <div class="small-btns">
                            <span class="icon-btn" onclick="shareToWhatsApp('${m.name}', ${m.amt}, ${m.paid})">📲 Share</span>
                            <span class="icon-btn" onclick="editMember(${m.id})">✏️ Edit</span>
                            <span class="icon-btn" onclick="deleteMember(${m.id})" style="color:#ff5252">🗑️</span>
                        </div>
                    </div>
                </div>
            `;
        });
        
        pCount.innerText = count;
        tCash.innerText = cash.toLocaleString();
    }

    render();
</script>

</body>
</html>
